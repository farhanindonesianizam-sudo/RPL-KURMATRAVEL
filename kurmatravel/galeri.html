
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Kurma Travel</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="static/css/style.css">

    <style>

        /* GRID GALERI */
        .gallery-grid {
            columns: 4 220px;
            column-gap: 16px;
        }

        .gallery-grid img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
            margin: 0 0 16px;
            break-inside: avoid;
            border-radius: 14px;
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease;
        }

        .gallery-grid img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 22px rgba(0, 0, 0, .15);
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .88);
        }

        .lightbox img {
            display: block;
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 22px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 38px;
            cursor: pointer;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,.48);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .lightbox-prev { left: 24px; }
        .lightbox-next { right: 24px; }
/* =========================================
   WHATSAPP MODAL - SAMA DENGAN INDEX
========================================= */

        .wa-modal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(14, 29, 21, 0.67);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .wa-modal.show {
            display: flex;
        }

        .wa-box {
            width: min(410px, 100%);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            background: var(--bg);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
            animation: modalEnter 0.25s ease both;
        }

        .wa-box h3 {
            margin-top: 0;
            margin-bottom: 23px;
            color: var(--green);
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            text-align: center;
        }

        .wa-box a {
            display: block;
            margin-bottom: 11px;
            padding: 13px 16px;
            border: 1px solid #dce9de;
            border-radius: 9px;
            background: #f2f8f2;
            color: var(--green);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .wa-box a:hover {
            border-color: #25a366;
            background: #25a366;
            color: var(--white);
        }

        .wa-box button {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #ecebe5;
            color: #47534b;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .wa-box button:hover {
            background: #deddd5;
        }

        /* ANIMASI MODAL */
        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================================
          FLOATING WHATSAPP - SAMA DENGAN INDEX
        ========================================= */

        .wa-float {
            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 2000;
            width: 57px;
            height: 57px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: #20b965;
            box-shadow: 0 7px 25px rgba(32, 185, 101, 0.32);
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px) scale(0.9);
            transition:
                opacity 0.3s ease,
                visibility 0.3s ease,
                transform 0.3s ease,
                background 0.25s ease;
        }

        .wa-float.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .wa-float:hover {
            background: #159c51;
            transform: translateY(-4px) scale(1.04);
        }

        .wa-float::before {
            content: "Chat Kami";
            position: absolute;
            right: 68px;
            padding: 7px 12px;
            border-radius: 7px;
            background: var(--green-dark);
            color: var(--white);
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transform: translateX(5px);
            transition: 0.2s ease;
        }

        .wa-float:hover::before {
            opacity: 1;
            visibility: visible;
            transform: translateX(0);
        }

        /* RESPONSIVE HP */
        @media (max-width: 480px) {
            .wa-box {
                width: 100%;
                max-width: 410px;
                padding: 25px 20px;
            }

            .wa-box h3 {
                font-size: 23px;
            }

            .wa-float {
                right: 16px;
                bottom: 16px;
                width: 52px;
                height: 52px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-flex">

            <div class="hamburger" id="hamburger">
                <span>☰</span>
                <span class="menu-text">MENU</span>
            </div>

            <div class="logo">
                <img src="static/images/logo.png" alt="Logo Kurma Travel">
                <span>KURMA TRAVEL</span>
            </div>

            <nav id="navMenu">
                <a href="index.html">Home</a>
                <a href="paket.html">Paket Umroh &amp; Haji</a>
                <a href="galeri.html" class="active">Galeri</a>
                <a href="staf.html">Staf</a>
                <a href="kontak.html">Kontak</a>
            </nav>

            <a href="#" class="btn-wa"
               onclick="openWA('Halo Kurma Travel, saya mau konsultasi paket umrah/haji yang tersedia'); return false;">
                Chat WhatsApp
            </a>

        </div>
    </header>

    <!-- MODAL PILIH ADMIN WHATSAPP -->
    <div id="waModal" class="wa-modal"
         onclick="if (event.target === this) closeWA();">

        <div class="wa-box">
            <h3>Pilih Admin WhatsApp</h3>

            <a id="wa1" href="#" target="_blank" rel="noopener noreferrer">
                Chat WA 1
            </a>

            <a id="wa2" href="#" target="_blank" rel="noopener noreferrer">
                Chat WA 2
            </a>

            <a id="wa3" href="#" target="_blank" rel="noopener noreferrer">
                Chat WA 3
            </a>

            <button type="button" onclick="closeWA()">Tutup</button>
        </div>
    </div>

    <!-- HEADER -->
    <section class="hero"
        style="background-image:url('static/images/hero.jpg'); height:40vh;">

        <div class="overlay"></div>

        <div class="container hero-content">
            <h1>Galeri Dokumentasi</h1>
            <p>Dokumentasi perjalanan jamaah Kurma Travel</p>
        </div>
    </section>

    <!-- GALERI -->
    <section class="section">
        <div class="container">
            <div class="gallery-grid" id="gallery"></div>
        </div>
    </section>

    <!-- LIGHTBOX FOTO -->
    <div id="lightbox" class="lightbox">

        <button type="button" class="lightbox-close"
                aria-label="Tutup foto">
            &times;
        </button>
        <button type="button" class="lightbox-nav lightbox-prev"
                aria-label="Foto sebelumnya">&#10094;</button>

        <img id="lightbox-img" src="" alt="Foto dokumentasi Kurma Travel">
        <button type="button" class="lightbox-nav lightbox-next"
                aria-label="Foto berikutnya">&#10095;</button>
    </div>

    <!-- FOOTER -->
    <footer>
        © 2026 Kurma Travel
    </footer>

</body>
</html>
